<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodle Automation Platform - Local MVP</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; margin: 0; padding: 20px;">
  <div style="max-width: 900px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    
    <h2>Moodle AutoQuiz Wizard (Local MVP)</h2>
    <p style="color: #666; font-size: 0.95rem;">
      Enter your active Moodle quiz URL below. Click <strong>Scan Quiz</strong> to open Chromium, extract page questions, and resolve them using Gemini AI.
    </p>

    <div style="margin: 20px 0;">
      <label for="quiz-url" style="display: block; font-weight: bold; margin-bottom: 6px;">Moodle Quiz Attempt URL:</label>
      <input type="text" id="quiz-url" placeholder="https://moodle.your-university.edu/mod/quiz/attempt.php?attempt=12345" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
    </div>

    <div style="margin-bottom: 20px;">
      <button id="scan-btn" style="background: #1a73e8; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">
        Scan Quiz & Resolve Answers
      </button>
      <button id="submit-btn" style="display: none; background: #28a745; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-left: 10px;">
        Apply & Fill Answers on Page
      </button>
    </div>

    <div id="status-message" style="display: none; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: 500;"></div>

    <h3>Extracted Questions & AI Approvals</h3>
    <div id="questions-container" style="margin-top: 16px;">
      <p style="color: #888; font-style: italic;">No active quiz scan performed yet.</p>
    </div>

  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
